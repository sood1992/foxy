---
deployment:
  tasks:
    - export DEPLOYPATH=/home/sunburni/public_html/foxy/
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/mkdir -p $DEPLOYPATH/uploads/asset_photos
    - /bin/mkdir -p $DEPLOYPATH/api/data
    # Copy PHP files but preserve existing uploads and data
    - /bin/cp -R app/*.php $DEPLOYPATH/
    - /bin/cp -R app/classes $DEPLOYPATH/
    - /bin/cp -R app/config $DEPLOYPATH/
    - /bin/cp -R app/cron $DEPLOYPATH/
    - /bin/cp -R app/logs $DEPLOYPATH/
